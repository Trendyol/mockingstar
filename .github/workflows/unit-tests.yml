name: Unit Tests

on:
  pull_request:
    branches:
    - "*"

jobs:
  test:
    name: 'Run Unit Tests'
    runs-on: macos-26

    steps:
    - name: Check out Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Run Xcode Unit Tests
      run: set -o pipefail && xcodebuild test -workspace MockingStar.xcworkspace -scheme MockingStar -testPlan TestPlan -skipMacroValidation | xcbeautify --renderer github-actions

    - name: Run Headless Core Tests
      run: swift test --package-path Core/MockingStarCore

    - name: Test Importable Engine and Host Integration
      run: |
        swift test
        python3 MockingStarEngine/Tests/consumer.py

    - name: Build and Exercise CLI
      run: |
        swift build --package-path MockingStarExecutable
        python3 MockingStarExecutable/Tests/integration.py

  linux-test:
    name: 'Linux Build Check'
    runs-on: ubuntu-24.04

    steps:
    - name: Check out Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: "6.2.3"

    - name: Prepare Dependencies
      run: |
            sudo apt-get update
            sudo apt-get install -y libcurl4-openssl-dev libedit-dev libsqlite3-dev libxml2-dev libicu-dev zlib1g-dev pkg-config

    - name: Linux Build Check
      run: swift build -c release --package-path ./MockingStarExecutable

    - name: Linux CLI Integration
      env:
        MOCKINGSTAR_BINARY: MockingStarExecutable/.build/release/mockingstar
      run: python3 MockingStarExecutable/Tests/integration.py

    - name: Linux Engine and Consumer Tests
      run: |
        swift test
        python3 MockingStarEngine/Tests/consumer.py
