name:  Release Linux CLI

on:
  release:
    types: [published]

jobs:
  test:
    name: 'Release Linux CLI App'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Check out Repository
      uses: actions/checkout@v4

    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: "6.2.3"

    - name: Set env
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

    - name: Prepare Dependencies
      run: |
            sudo apt-get update
            sudo apt-get install -y libcurl4-openssl-dev libedit-dev libsqlite3-dev libxml2-dev libicu-dev zlib1g-dev pkg-config

    - name: Build Mocking Star CLI
      run: swift build -c release --package-path ./MockingStarExecutable --static-swift-stdlib

    - name: Create Zip
      run: python3 MockingStarExecutable/scripts/package.py --skip-build --output .build/MockingStar-Linux-CLI.zip

    - name: Create a Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ github.event.release.tag_name }}
        name: MockingStar - Release ${{ github.event.release.tag_name }}
        artifacts: '.build/MockingStar-Linux-CLI.zip'
        allowUpdates: true
        omitBodyDuringUpdate: true
        makeLatest: false
